<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innovation Grant Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a202c;
    }
    header {
      background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
      color: white;
      padding: 28px 36px;
    }
    header h1 { font-size: 1.8rem; font-weight: 700; }
    header p { margin-top: 4px; opacity: 0.85; font-size: 0.95rem; }

    .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    /* KPI Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-left: 4px solid #2b6cb0;
    }
    .card.green  { border-left-color: #38a169; }
    .card.orange { border-left-color: #dd6b20; }
    .card.red    { border-left-color: #e53e3e; }
    .card.purple { border-left-color: #805ad5; }
    .card label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #718096; }
    .card .value { font-size: 1.75rem; font-weight: 700; margin-top: 6px; }
    .card .sub   { font-size: 0.8rem; color: #a0aec0; margin-top: 2px; }

    /* Charts grid */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }

    .chart-box {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .chart-box.wide { grid-column: 1 / -1; }
    .chart-box h2 { font-size: 0.95rem; font-weight: 600; color: #2d3748; margin-bottom: 16px; }
    .chart-box canvas { max-height: 260px; }
    .chart-box.wide canvas { max-height: 300px; }

    /* Year tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
      padding: 8px 18px; border-radius: 8px; border: 2px solid #2b6cb0;
      background: white; color: #2b6cb0; cursor: pointer; font-size: 0.88rem; font-weight: 600;
      transition: all 0.15s;
    }
    .tab.active { background: #2b6cb0; color: white; }

    /* Table */
    .table-wrap {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    .table-wrap h2 { font-size: 0.95rem; font-weight: 600; color: #2d3748; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th { background: #edf2f7; text-align: left; padding: 10px 12px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #718096; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f4f8; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f7fafc; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    }
    .badge.full    { background: #c6f6d5; color: #276749; }
    .badge.partial { background: #fefcbf; color: #744210; }
    .badge.denied  { background: #fed7d7; color: #9b2c2c; }
    .badge.paused  { background: #e9d8fd; color: #553c9a; }
    .badge.pending { background: #bee3f8; color: #2c5282; }

    .pct-bar { height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; margin-top: 4px; }
    .pct-fill { height: 100%; border-radius: 3px; background: #2b6cb0; }
  </style>
</head>
<body>

<header>
  <h1>Innovation Grant Dashboard</h1>
  <p>Aurora Public Schools — Grant Applications & Awards Overview</p>
</header>

<div class="container">

  <!-- Year selector -->
  <div class="tabs">
    <button class="tab active" onclick="setYear('all')">All Years</button>
    <button class="tab" onclick="setYear('2024-2025')">2024-2025</button>
    <button class="tab" onclick="setYear('2025-2026')">2025-2026</button>
  </div>

  <!-- KPI Cards -->
  <div class="cards" id="kpi-cards"></div>

  <!-- Charts -->
  <div class="charts">
    <div class="chart-box wide">
      <h2>Amount Requested vs. Granted by Program</h2>
      <canvas id="barChart"></canvas>
    </div>
    <div class="chart-box">
      <h2>Application Status Breakdown</h2>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="chart-box">
      <h2>Year-over-Year Comparison</h2>
      <canvas id="yoyChart"></canvas>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <h2>All Applications</h2>
    <table id="grants-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Applicant</th>
          <th>School / Dept</th>
          <th>Program</th>
          <th>Requested</th>
          <th>Granted</th>
          <th>Funded %</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
const ALL_GRANTS = [
  // 2024-2025
  { year: '2024-2025', date: '2025-02-01', applicant: 'Johanna Carter',       school: 'Mrachek Middle School',             program: 'The Snake Man!',                                    requested: 1000,    granted: 1000   },
  { year: '2024-2025', date: '2025-02-12', applicant: 'Peter Russo',           school: 'Altura Elementary School',          program: 'Expanding STEM: 3D Printing & Smart Robotics',      requested: 1878.95, granted: 1878.95},
  { year: '2024-2025', date: '2025-03-31', applicant: 'Jessica Brown',         school: 'Clara Brown Entrepreneurial Acad.', program: 'YouthBiz Workshops',                                requested: 3000,    granted: 3000   },
  { year: '2024-2025', date: '2025-04-09', applicant: 'Andy Yankovich',        school: 'Aurora Central HS',                 program: 'Scholastics Field Trip to DAM',                     requested: 4770,    granted: 900    },
  { year: '2024-2025', date: '2025-05-20', applicant: 'Jason Wiedmaier',       school: 'William Smith HS',                  program: 'Digital to Wearable',                               requested: 7191,    granted: 3946   },
  { year: '2024-2025', date: '2025-05-20', applicant: 'Elizabeth Speiser',     school: 'Del Mar Academy',                   program: 'School Uniform Implementation',                     requested: 10000,   granted: 0      },
  { year: '2024-2025', date: '2025-06-23', applicant: 'Rachael Ribota',        school: 'VPE',                               program: 'Girls Empowerment through Soccer Jerseys',          requested: 2000,    granted: 0      },
  // 2025-2026
  { year: '2025-2026', date: '2025-08-19', applicant: 'Sarah La Due',          school: 'Charles Burrell',                   program: 'Odyssey of the Mind at Burrell Arts K-8',           requested: 290,     granted: 290    },
  { year: '2025-2026', date: '2025-10-20', applicant: 'Lydia Klingensmith',    school: 'Lansing Elementary',                program: 'BookTrust for Lansing',                             requested: 1200,    granted: 1200   },
  { year: '2025-2026', date: '2025-12-10', applicant: 'Christina Knight',      school: 'Gateway High School',               program: 'Oly Torch Crew Leadership Program',                 requested: 5000,    granted: 3500   },
  { year: '2025-2026', date: '2026-01-14', applicant: 'Rachel Lesser',         school: 'Dartmouth Elementary',              program: 'Mobile Music Studio',                               requested: 3500,    granted: 1250   },
  { year: '2025-2026', date: '2026-01-20', applicant: 'Vicky Aguero-Sizemore', school: 'Aurora West College Prep',          program: 'Multilingual Math Access via STEM Circuit Kits',    requested: 4800,    granted: 3400,  status: 'paused'},
  { year: '2025-2026', date: '2026-02-05', applicant: 'Kendra Schurich',       school: 'VPP',                               program: 'VIBE Interdisciplinary Project Based Learning',     requested: 5000,    granted: 3000   },
  { year: '2025-2026', date: '2026-02-09', applicant: 'Amy Nieves',            school: 'Aurora Hills Middle School',        program: 'After School Tutoring Program',                     requested: 5000,    granted: 1000   },
  { year: '2025-2026', date: '2026-03-04', applicant: 'Andrew Nease',          school: '—',                                 program: 'Multicam Live Production for Career Readiness',     requested: 1645,    granted: null,  status: 'pending'},
];

function getStatus(g) {
  if (g.status) return g.status;
  if (g.granted === null || g.granted === undefined) return 'pending';
  if (g.granted === 0) return 'denied';
  if (g.granted >= g.requested) return 'full';
  return 'partial';
}

function fmt(n) {
  if (n === null || n === undefined) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

let currentYear = 'all';
let barChart, pieChart, yoyChart;

function filtered() {
  return currentYear === 'all' ? ALL_GRANTS : ALL_GRANTS.filter(g => g.year === currentYear);
}

function setYear(y) {
  currentYear = y;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const data = filtered();
  renderKPI(data);
  renderBar(data);
  renderPie(data);
  renderYoY();
  renderTable(data);
}

function renderKPI(data) {
  const totalReq = data.reduce((s, g) => s + g.requested, 0);
  const totalGrn = data.reduce((s, g) => s + (g.granted || 0), 0);
  const pct = totalReq > 0 ? Math.round((totalGrn / totalReq) * 100) : 0;
  const statuses = data.map(getStatus);
  const approved = statuses.filter(s => s === 'full').length;
  const denied = statuses.filter(s => s === 'denied').length;

  const budget2526 = 25000;
  const remaining = budget2526 - ALL_GRANTS.filter(g => g.year === '2025-2026').reduce((s, g) => s + (g.granted || 0), 0);

  const cards = [
    { label: 'Total Applications', value: data.length, sub: 'across all schools', cls: '' },
    { label: 'Total Requested', value: fmt(totalReq), sub: 'by applicants', cls: '' },
    { label: 'Total Granted', value: fmt(totalGrn), sub: `${pct}% funding rate`, cls: 'green' },
    { label: 'Fully Approved', value: approved, sub: `of ${data.length} applications`, cls: 'green' },
    { label: 'Denied', value: denied, sub: `of ${data.length} applications`, cls: 'red' },
    { label: '2025-26 Budget Left', value: fmt(remaining), sub: '$25,000 annual budget', cls: 'purple' },
  ];

  document.getElementById('kpi-cards').innerHTML = cards.map(c => `
    <div class="card ${c.cls}">
      <label>${c.label}</label>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join('');
}

function renderBar(data) {
  const labels = data.map(g => g.applicant.split(' ').slice(0,2).join(' '));
  const requested = data.map(g => g.requested);
  const granted = data.map(g => g.granted || 0);

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Requested', data: requested, backgroundColor: 'rgba(66,153,225,0.6)', borderColor: '#2b6cb0', borderWidth: 1 },
        { label: 'Granted',   data: granted,   backgroundColor: 'rgba(56,161,105,0.7)', borderColor: '#276749', borderWidth: 1 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { ticks: { callback: v => '$' + v.toLocaleString() }, beginAtZero: true },
        x: { ticks: { font: { size: 11 } } }
      }
    }
  });
}

function renderPie(data) {
  const counts = { full: 0, partial: 0, denied: 0, paused: 0, pending: 0 };
  data.forEach(g => counts[getStatus(g)]++);

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: ['Fully Approved', 'Partial', 'Denied', 'Paused', 'Pending'],
      datasets: [{
        data: [counts.full, counts.partial, counts.denied, counts.paused, counts.pending],
        backgroundColor: ['#38a169','#d69e2e','#e53e3e','#805ad5','#3182ce'],
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } }
    }
  });
}

function renderYoY() {
  const y1 = ALL_GRANTS.filter(g => g.year === '2024-2025');
  const y2 = ALL_GRANTS.filter(g => g.year === '2025-2026');

  const req1 = y1.reduce((s, g) => s + g.requested, 0);
  const grn1 = y1.reduce((s, g) => s + (g.granted || 0), 0);
  const req2 = y2.reduce((s, g) => s + g.requested, 0);
  const grn2 = y2.reduce((s, g) => s + (g.granted || 0), 0);

  if (yoyChart) yoyChart.destroy();
  yoyChart = new Chart(document.getElementById('yoyChart'), {
    type: 'bar',
    data: {
      labels: ['2024-2025', '2025-2026'],
      datasets: [
        { label: 'Requested', data: [req1, req2], backgroundColor: 'rgba(66,153,225,0.6)', borderColor: '#2b6cb0', borderWidth: 1 },
        { label: 'Granted',   data: [grn1, grn2], backgroundColor: 'rgba(56,161,105,0.7)', borderColor: '#276749', borderWidth: 1 },
        { label: 'Budget',    data: [null, 25000], backgroundColor: 'rgba(229,62,62,0.15)',  borderColor: '#e53e3e', borderWidth: 2, type: 'line', pointRadius: 5 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'top' } },
      scales: { y: { ticks: { callback: v => '$' + v.toLocaleString() }, beginAtZero: true } }
    }
  });
}

function renderTable(data) {
  const tbody = document.querySelector('#grants-table tbody');
  tbody.innerHTML = data.map(g => {
    const status = getStatus(g);
    const pct = g.granted !== null && g.granted !== undefined ? Math.round((g.granted / g.requested) * 100) : null;
    const badgeMap = { full: 'Full Approval', partial: 'Partial', denied: 'Denied', paused: 'Paused', pending: 'Pending' };
    return `
      <tr>
        <td style="white-space:nowrap">${fmtDate(g.date)}</td>
        <td>${g.applicant}</td>
        <td>${g.school}</td>
        <td>${g.program}</td>
        <td style="text-align:right">${fmt(g.requested)}</td>
        <td style="text-align:right">${fmt(g.granted)}</td>
        <td style="min-width:80px">
          ${pct !== null ? `<span style="font-size:0.8rem;font-weight:600">${pct}%</span><div class="pct-bar"><div class="pct-fill" style="width:${Math.min(pct,100)}%;background:${status==='denied'?'#e53e3e':status==='full'?'#38a169':'#2b6cb0'}"></div></div>` : '—'}
        </td>
        <td><span class="badge ${status}">${badgeMap[status]}</span></td>
      </tr>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
