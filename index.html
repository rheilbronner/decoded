<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #hud {
      display: flex;
      gap: 40px;
      margin-bottom: 12px;
      font-size: 1rem;
      color: #aaa;
    }

    #hud span { color: #4ecca3; font-weight: bold; }

    #canvas {
      border: 2px solid #4ecca3;
      box-shadow: 0 0 20px #4ecca355;
      display: block;
    }

    #message {
      margin-top: 16px;
      font-size: 1rem;
      color: #aaa;
      height: 1.4em;
      letter-spacing: 1px;
    }

    #message.active { color: #f7c59f; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div id="hud">
    SCORE: <span id="score">0</span> &nbsp;&nbsp; HIGH: <span id="high">0</span>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message" class="active">Press any arrow key or WASD to start</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const msgEl = document.getElementById('message');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;
    const SPEED = 120; // ms per tick

    let snake, dir, nextDir, food, score, highScore, running, gameOver, loop;

    highScore = 0;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      running = false;
      scoreEl.textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied.has(`${pos.x},${pos.y}`));
      food = pos;
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        endGame(); return;
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score > highScore) { highScore = score; highEl.textContent = highScore; }
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid (subtle)
      ctx.strokeStyle = '#1e2d4a';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      // food shine
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(fx - 3, fy - 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        const t = 1 - (i / snake.length) * 0.5;
        ctx.fillStyle = isHead ? '#4ecca3' : `rgba(78,204,163,${t})`;
        const pad = isHead ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, isHead ? 4 : 3);
        ctx.fill();

        // Eyes on head
        if (isHead) {
          ctx.fillStyle = '#16213e';
          const ex1 = seg.x * CELL + (dir.y !== 0 ? 5 : dir.x > 0 ? 13 : 5);
          const ey1 = seg.y * CELL + (dir.x !== 0 ? 5 : dir.y > 0 ? 13 : 5);
          const ex2 = seg.x * CELL + (dir.y !== 0 ? 13 : dir.x > 0 ? 13 : 5);
          const ey2 = seg.y * CELL + (dir.x !== 0 ? 13 : dir.y > 0 ? 13 : 5);
          ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI * 2); ctx.fill();
        }
      });

      // Game over overlay
      if (gameOver) {
        ctx.fillStyle = 'rgba(22,33,62,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = '#aaa';
        ctx.font = '16px Courier New';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 18);
        ctx.fillText('Press any arrow key to restart', canvas.width / 2, canvas.height / 2 + 44);
        ctx.textAlign = 'left';
      }
    }

    function endGame() {
      running = false;
      gameOver = true;
      clearInterval(loop);
      msgEl.textContent = '';
      msgEl.classList.remove('active');
      draw();
    }

    function start() {
      if (gameOver) init();
      if (!running) {
        running = true;
        msgEl.textContent = '';
        loop = setInterval(tick, SPEED);
      }
    }

    const DIRS = {
      ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
      ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
      ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
      ArrowRight: { x:  1, y: 0 }, d: { x:  1, y: 0 }, D: { x:  1, y: 0 },
    };

    document.addEventListener('keydown', e => {
      const d = DIRS[e.key];
      if (!d) return;
      e.preventDefault();
      // Prevent 180° reversal
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
      start();
    });

    init();
  </script>
</body>
</html>
